name: Validate NixOS flake

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host:
          - nixos-portatil
          - nixos-pc
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Drop in CI-only hardware-configuration.nix stub
        run: sudo mkdir -p /etc/nixos && sudo cp ci/hardware-configuration.stub.nix /etc/nixos/hardware-configuration.nix

      - name: Build ${{ matrix.host }} system closure
        run: nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" -L --impure
